<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Graph3D — Chart Gallery</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
      canvas { display: block; }

      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        background: rgba(20, 20, 24, 0.75);
        color: #eee;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 13px;
        backdrop-filter: blur(6px);
        max-width: 360px;
      }
      #panel h1 { font-size: 14px; margin-bottom: 6px; }
      #panel p { opacity: 0.7; font-size: 11px; margin-top: 6px; line-height: 1.4; }
      #panel ul { list-style: none; font-size: 11px; opacity: 0.85; columns: 2; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>Graph3D — Chart Gallery (Prompt 144)</h1>
      <ul>
        <li>Bar</li><li>Line</li><li>Scatter</li><li>Area</li>
        <li>Surface</li><li>Heatmap</li><li>Network</li><li>Tree</li>
        <li>Pack</li><li>Pie</li><li>Volume</li>
      </ul>
      <p>
        One instance of every Phase 8 chart type, each attached to its own <code>THREE.Group</code>
        cell in a shared scene — the homepage hero. Drag to orbit.
      </p>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
