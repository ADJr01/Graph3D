<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Graph3D — Phase 2 Scene Composition</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
      canvas { display: block; }

      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 280px;
        background: rgba(20, 20, 24, 0.75);
        color: #eee;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 13px;
        backdrop-filter: blur(6px);
      }
      #panel h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.6;
        margin: 10px 0 6px;
      }
      #panel h2:first-child { margin-top: 0; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      button {
        background: #2a2a32;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { background: #3a3a44; }
      button.active { background: #4f7cff; border-color: #4f7cff; }
      #status {
        margin-top: 10px;
        font-size: 11px;
        color: #ff8080;
        white-space: pre-wrap;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <h2>Theme</h2>
      <div class="row" data-group="theme"></div>
      <h2>Camera</h2>
      <div class="row" data-group="camera"></div>
      <h2>HDR</h2>
      <div class="row" data-group="hdr"></div>
      <div class="row" style="margin-top: 6px;">
        <input type="file" id="customHdrInput" accept=".hdr,.exr" />
      </div>
      <h2>Fog</h2>
      <div class="row" data-group="fog"></div>
      <div id="status"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
