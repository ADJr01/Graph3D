<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Graph3D — Phase 6 Materials & Procedural FX</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #050507; font-family: system-ui, sans-serif; }
      canvas { display: block; }

      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        background: rgba(20, 20, 24, 0.75);
        color: #eee;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 12px;
        backdrop-filter: blur(6px);
        max-width: 300px;
      }
      #panel h1 { font-size: 14px; margin-bottom: 6px; }
      #panel ol { margin: 6px 0 0 18px; opacity: 0.85; line-height: 1.5; }
      #panel p { opacity: 0.7; font-size: 11px; margin-top: 8px; line-height: 1.4; }
      #status { opacity: 0.6; font-size: 11px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>Phase 6 — one bar per material preset</h1>
      <ol id="presetList"></ol>
      <p>
        16 of Phase 6's presets, one per bar, <code>studio-dark</code> themed.
        <code>matcap</code> uses a procedural radial gradient standing in for
        a captured sphere image; <code>dataDriven</code> reads a per-vertex
        gradient through <code>palette.viridis</code>.
      </p>
      <div id="status"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
